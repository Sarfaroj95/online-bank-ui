<aside class="flex h-screen w-64 flex-col bg-[#1e4456] text-white overflow-hidden shadow-2xl">

  <!-- Profile -->
  <div class="flex flex-col items-center py-6 px-6 text-center border-b border-white/5">
    <div class="relative mb-4 group">
      <img src="https://ui-avatars.com/api/?name=Jisan+Hoque+G&background=fff&color=1e4456"
           class="h-20 w-20 rounded-full border-4 border-white/20 p-1 object-cover transition-transform duration-500 group-hover:scale-110" />
      <div class="absolute bottom-1 right-1 h-4 w-4 bg-green-500 border-2 border-[#1e4456] rounded-full"></div>
    </div>
    <h3 class="text-sm font-bold tracking-tight text-white">Jisan Hoque Gayen</h3>
    <p class="text-[10px] text-white/40 uppercase tracking-widest mt-1">Admin Account</p>
  </div>

  <!-- Nav -->
  <nav class="flex-1 pt-6 pl-4 relative" style="space-y: 0;">

    <!-- Sliding pill — moves via [style.top.px] -->
    <div class="sliding-indicator" [style.top.px]="getActiveOffset()"></div>

    <a (click)="setActive('Dashboard', 0)"
       routerLink="/dashboard/overview"
       [ngClass]="{'active-text': activeMenuItem === 'Dashboard'}"
       class="nav-link">
      <span class="material-icons text-[20px]">grid_view</span>
      <span class="font-medium tracking-wide">Dashboard</span>
    </a>

    <a (click)="setActive('Analytics', 1)"
       routerLink="/dashboard/analytics"
       [ngClass]="{'active-text': activeMenuItem === 'Analytics'}"
       class="nav-link">
      <span class="material-icons text-[20px]">insights</span>
      <span class="font-medium tracking-wide">Analytics</span>
    </a>



    <a (click)="setActive('Transactions', 2)"
       routerLink="/dashboard/transactions"
       [ngClass]="{'active-text': activeMenuItem === 'Transactions'}"
       class="nav-link">
      <span class="material-icons text-[20px]">receipt_long</span>
      <span class="font-medium tracking-wide">Transactions</span>
    </a>

    <a (click)="setActive('Investment', 3)"
    routerLink="/dashboard/investment"
       [ngClass]="{'active-text': activeMenuItem === 'Investment'}"
       class="nav-link">
      <span class="material-icons text-[20px]">account_balance_wallet</span>
      <span class="font-medium tracking-wide">Investment</span>
    </a>

    <a (click)="setActive('Customers', 4)"
       routerLink="/dashboard/customers"
       [ngClass]="{'active-text': activeMenuItem === 'Customers'}"
       class="nav-link">
      <span class="material-icons text-[20px]">people</span>
      <span class="font-medium tracking-wide">Customers</span>
    </a>

  </nav>

  <!-- Logout -->
  <div class="p-8 border-t border-white/5 cursor-pointer">
    <button routerLink="/admin-login"
            class="flex items-center gap-4 text-sm text-white/50 hover:text-red-400 transition-all duration-300 group w-full cursor-pointer">
      <span class="material-icons text-[20px] transition-transform group-hover:-translate-x-1">logout</span>
      <span class="font-medium">Logout</span>
    </button>
  </div>

</aside>
